{% extends 'base.html' %}
{% block content %}
<div class="card confirm-card">
    <div class="card-body">
        <div class="confirm-icon">⚠️</div>
        <h2>¿Eliminar venta {{ venta.folio }}?</h2>
        <p>Se restaurará el stock de los productos asociados. Esta acción no se puede deshacer.</p>
        <form method="post">
            {% csrf_token %}
            <div class="form-actions" style="justify-content:center;border:none;">
                <button type="submit" class="btn btn-danger">🗑️ Sí, eliminar</button>
                <a href="{% url 'venta_lista' %}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
